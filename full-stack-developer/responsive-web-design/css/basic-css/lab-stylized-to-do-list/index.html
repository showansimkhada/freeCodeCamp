<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Styled To-Do List</title>
        <link rel="stylesheets" href="./styles.css">
    </head>
    <body>
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li class="list-items">
                <input type="checkbox" id="game">
                <label for="game">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="#" target="_blank">Store link</a>
                    </li>
                </ul>
            </li>
            <li class="list-items">
                <input type="checkbox" id="report">
                <label for="report">Finish the report</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="#" target="_blank">Request Access</a>
                    </li>
                </ul>
            </li>
            <li  class="list-items">
                <input type="checkbox" id="phone">
                <label for="phone">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="#" target="_blank">View Receipts</a>
                    </li>
                </ul>
            </li>
            <li  class="list-items">
                <input type="checkbox" id="specs">
                <label for="specs">Check Processor Specs</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="#" target="_blank">View model number</a>
                    </li>
                </ul>
            </li>
        </ul>
    </body>
</html>
